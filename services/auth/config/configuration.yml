# Local-dev Authelia config for https://*.workflow.tech (via Caddy).
# Secrets here are for local compose only — replace for any shared environment.

server:
  address: 'tcp://:9091'

log:
  level: 'info'

totp:
  disable: true

authentication_backend:
  file:
    path: '/config/users.yml'
    password:
      algorithm: 'argon2'

access_control:
  default_policy: 'deny'
  rules:
    - domain: 'auth.workflow.tech'
      policy: 'bypass'
    - domain: '*.workflow.tech'
      policy: 'one_factor'

session:
  secret: 'local_only_session_secret_change_me_32chars'
  cookies:
    - domain: 'workflow.tech'
      authelia_url: 'https://auth.workflow.tech'
      default_redirection_url: 'https://api.workflow.tech'

storage:
  encryption_key: 'local_only_storage_encryption_key_change_me'
  postgres:
    address: 'tcp://auth_database:5432'
    database: 'authelia'
    username: 'authelia'
    password: 'authelia'

notifier:
  filesystem:
    filename: '/config/notification.txt'

identity_validation:
  reset_password:
    jwt_secret: 'local_only_reset_password_jwt_secret_change'
