services:
  iam:
    build: .
    depends_on:
      iam_database:
        condition: service_healthy
      iam_migrations:
        condition: service_completed_successfully
    environment:
      SERVER_ADDRESS: "0.0.0.0:3000"
      DATABASE_URL: postgres://postgres:postgres@iam_database:5432/iam_db?sslmode=disable
      APP_ENV: local
    ports:
      - "3001:3000"
    volumes:
      - .:/app
    networks:
      - distributed-workflow

  iam_migrations:
    build: .
    depends_on:
      iam_database:
        condition: service_healthy
    environment:
      GOOSE_DBSTRING: postgres://postgres:postgres@iam_database:5432/iam_db?sslmode=disable
      GOOSE_DRIVER: postgres
      GOOSE_MIGRATION_DIR: /app/migrations
      GOOSE_TABLE: goose_migrations
    volumes:
      - ./migrations:/app/migrations
    networks:
      - distributed-workflow
    command: go tool goose up

  iam_outbox_relay:
    build: .
    depends_on:
      iam_database:
        condition: service_healthy
      iam_kafka:
        condition: service_healthy
      iam_migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@iam_database:5432/iam_db?sslmode=disable
      KAFKA_BROKERS: iam_kafka:19092
      RELAY_SERVER_ADDRESS: "0.0.0.0:3002"
      APP_ENV: local
    ports:
      - "3002:3002"
    volumes:
      - .:/app
    networks:
      - distributed-workflow
    command: go run ./cmd/outbox-relay

  iam_database:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: iam_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - iam_data:/var/lib/postgresql
    networks:
      - distributed-workflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  iam_kafka:
    image: apache/kafka:4.3.1
    hostname: iam_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://iam_kafka:19092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@iam_kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - distributed-workflow
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 5s
      timeout: 5s
      retries: 20
